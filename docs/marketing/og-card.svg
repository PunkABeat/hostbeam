<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for apps/web/public/assets/og.png — the link preview card.

  Why a PNG at all: og:image was the app icon as SVG, and Twitter/X, Slack,
  iMessage and LinkedIn all refuse to render an SVG preview. Hostbeam travels
  by one developer pasting a link to another, so a dead preview card cost more
  reach than any font choice on the page.

  What it shows: the pasted path. That line is the product — the path your
  agent turns into the picture — and it is the one thing worth showing at
  Slack-thumbnail size. It is the bare path because that is what a beam copies
  since Mac 0.1.32 and iPhone build 10 (ADR 0006's amendment).

  Regenerate (needs `rsvg-convert`, from `brew install librsvg`, and the Geist
  TTFs; Geist ships here as woff2, so decompress it first with
  `brew install woff2`):

    mkdir -p /tmp/hb-og/fonts
    cp packages/ui/src/assets/fonts/Geist-*.woff2 /tmp/hb-og/fonts/
    (cd /tmp/hb-og/fonts && for f in *.woff2; do woff2_decompress "$f"; done)
    cat > /tmp/hb-og/fonts.conf <<'CONF'
    <?xml version="1.0"?>
    <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
    <fontconfig>
      <dir>/tmp/hb-og/fonts</dir>
      <dir>/System/Library/Fonts</dir>
      <dir>/System/Library/Fonts/Supplemental</dir>
      <dir>/System/Applications/Utilities/Terminal.app/Contents/Resources/Fonts</dir>
      <cachedir>/tmp/hb-og/fccache</cachedir>
    </fontconfig>
    CONF
    FONTCONFIG_FILE=/tmp/hb-og/fonts.conf rsvg-convert docs/marketing/og-card.svg \
      -w 1200 -h 630 -o apps/web/public/assets/og.png

  Colours are the site's dark palette (landing.css `.theme-dark .site`), so the
  card and the page agree. Type is Geist — the app's own UI face — and Menlo
  for the path, which is the same rule the page follows: mono is for values you
  could type.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="hb-bg" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A95FF"/>
      <stop offset="1" stop-color="#2A66EC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a1424"/>

  <!-- wordmark, top left -->
  <g transform="translate(72, 62)">
    <g transform="scale(1.5)">
      <circle cx="12" cy="3.6" r="1.58" fill="#4c8dff"/>
      <path d="M10.35 7.5 H13.65" stroke="#4c8dff" stroke-width="1.95" stroke-linecap="round"/>
      <path d="M8.78 11.25 H15.23" stroke="#4c8dff" stroke-width="1.95" stroke-linecap="round"/>
      <rect x="6.9" y="14.4" width="10.2" height="7.05" rx="2.25" fill="#4c8dff"/>
    </g>
    <text x="52" y="27" font-family="Geist" font-size="27" font-weight="600"
          letter-spacing="-0.5" fill="#e7edf8">Hostbeam</text>
  </g>

  <!-- app icon, top right -->
  <g transform="translate(1032, 56) scale(0.09375)">
    <rect width="1024" height="1024" rx="232" fill="url(#hb-bg)"/>
    <rect width="1024" height="512" rx="232" fill="#FFFFFF" opacity="0.07"/>
    <rect x="478" y="296" width="68" height="332" rx="34" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="512" cy="250" r="50" fill="#FFFFFF"/>
    <path d="M462 362 H562" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <path d="M430 454 H594" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <path d="M392 546 H632" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <rect x="360" y="616" width="304" height="226" rx="48" fill="#FFFFFF"/>
    <rect x="404" y="664" width="216" height="130" rx="22" fill="url(#hb-bg)" opacity="0.26"/>
  </g>

  <!-- headline: the launch message, one sentence a line, the film's blue on
       the words that carry it (docs/process/launch-day.md) -->
  <g font-family="Geist" font-size="60" font-weight="700" letter-spacing="-2.5" fill="#e7edf8">
    <text x="72" y="232">Agent on a <tspan fill="#4c8dff">server?</tspan></text>
    <text x="72" y="300">Show it <tspan fill="#4c8dff">anything.</tspan></text>
    <text x="72" y="368">See what it <tspan fill="#4c8dff">built.</tspan></text>
  </g>

  <!-- the pasted line: what your clipboard holds a second later -->
  <rect x="72" y="404" width="1056" height="86" rx="14" fill="#101d33" stroke="#22324f"/>
  <text x="104" y="455" font-family="Menlo" font-size="23" fill="#4c8dff"
        font-weight="500">/tmp/hostbeam/hostbeam-1788875278869.png</text>

  <!-- what it is, in one line -->
  <text x="72" y="558" font-family="Geist" font-size="23" font-weight="400"
        letter-spacing="-0.3" fill="#8fa0bd">From your Mac or your iPhone, over your own SSH. No account, no relay, no telemetry.</text>
</svg>
