<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostbeam — beam a screenshot straight to your server</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    font-family: var(--font-system);
    background: var(--page-bg);
    color: var(--label);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv01";
  }
  /* Page-level surface tones (distinct from the dense app tokens) */
  .site {
    --page-bg: #FBFBFC;
    --page-bg-alt: #F4F5F7;
    --page-card: #FFFFFF;
    --page-ink: var(--label);
    --hero-wall: radial-gradient(120% 95% at 78% 6%, #6E7C99 0%, #41506b 46%, #2c374d 100%);
    background: var(--page-bg);
    min-height: 100vh;
  }
  .site.theme-dark {
    --page-bg: #0E0F12;
    --page-bg-alt: #15161A;
    --page-card: #1A1B1F;
    --hero-wall: radial-gradient(120% 95% at 78% 6%, #46506a 0%, #2a3346 46%, #161c28 100%);
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  a { color: inherit; }

  /* ----- Type scale (marketing, larger than the utility app scale) ----- */
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 14px;
  }
  .display {
    font-size: clamp(40px, 6.0vw, 66px); line-height: 1.04; letter-spacing: -0.03em;
    font-weight: 600; margin: 0; color: var(--label); text-wrap: balance;
  }
  .lede {
    font-size: clamp(16px, 1.55vw, 19px); line-height: 1.55; color: var(--label-secondary);
    margin: 22px 0 0; max-width: 33em; text-wrap: pretty;
  }
  .h2 {
    font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -0.025em;
    font-weight: 600; margin: 0; color: var(--label); text-wrap: balance;
  }
  .sub { font-size: clamp(15px, 1.4vw, 17px); line-height: 1.55; color: var(--label-secondary); margin: 16px 0 0; max-width: 32em; text-wrap: pretty; }

  .mono { font-family: var(--font-mono); }

  /* ----- Buttons (marketing scale) ----- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    height: 48px; padding: 0 22px; border-radius: var(--radius-lg); border: 0; cursor: pointer;
    font-family: var(--font-system); font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    text-decoration: none; transition: var(--transition-control); white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(var(--press-scale)); }
  .btn-ghost { background: var(--fill); color: var(--label); box-shadow: inset 0 0 0 0.5px var(--separator); }
  .btn-ghost:hover { background: var(--fill-hover); }
  .btn-sm { height: 38px; padding: 0 16px; font-size: 13.5px; border-radius: var(--radius-md); }

  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius-md); }
  :focus:not(:focus-visible) { outline: none; }

  /* ----- Nav ----- */
  .nav {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: color-mix(in srgb, var(--page-bg) 80%, transparent);
    box-shadow: inset 0 -0.5px 0 var(--separator);
  }
  .nav-in { display: flex; align-items: center; gap: 14px; height: 60px; }
  .nav-link { font-size: 13.5px; color: var(--label-secondary); text-decoration: none; padding: 8px 10px; border-radius: var(--radius-md); }
  .nav-link:hover { color: var(--label); background: var(--fill-hover); }

  /* ----- macOS desktop scene (hero) ----- */
  .scene {
    position: relative; border-radius: 16px; overflow: hidden;
    background: var(--hero-wall);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 30px 70px -20px rgba(20,30,60,0.45), 0 0 0 0.5px rgba(0,0,0,0.18);
    aspect-ratio: 16 / 11;
  }
  .scene-mb {
    position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 5;
    display: flex; align-items: center; gap: 18px; padding: 0 14px; color: #fff;
    background: rgba(20,22,28,0.34); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: inset 0 -0.5px 0 rgba(255,255,255,0.08);
  }
  .mb-app { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 22px; border-radius: 5px; background: rgba(255,255,255,0.20); }
  .scene-anchor { position: absolute; top: 38px; right: 5%; z-index: 6; transform-origin: top right; }

  /* ----- beam-mark upload animation (BeamMark) — the one signature motion ----- */
  .bm .bm-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .bm .bm-node { transform-box: fill-box; transform-origin: center; }
  .bm-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .bm-uploading .bm-el { animation: bmPulse 1.25s ease-in-out infinite; }
    .bm-uploading .bm-ring { animation: bmRing 1.25s ease-out infinite; animation-delay: .36s; }
    .bm-landing .bm-ring { animation: bmRing .72s ease-out 1 forwards; }
    .bm-landing .bm-node { animation: bmPop .6s ease-out 1; }
    .bm-bar { width: 45%; animation: bmBar 1.1s ease-in-out infinite; }
    .bm-bar.done { width: 100%; animation: none; transform: none; transition: width .3s ease; }
  }
  @keyframes bmPulse { 0%,100% { opacity: .38; } 14% { opacity: 1; } 42% { opacity: .38; } }
  @keyframes bmRing { 0% { opacity: .5; transform: scale(.55); } 46% { opacity: 0; transform: scale(2); } 100% { opacity: 0; transform: scale(2); } }
  @keyframes bmPop { 0% { transform: scale(1); } 40% { transform: scale(1.24); } 100% { transform: scale(1); } }
  @keyframes bmBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
  @keyframes mbBlip {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    32%  { transform: scale(1.18); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
    100% { transform: scale(1);    box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent); }
  }
  @media (prefers-reduced-motion: no-preference) { .mb-app.blip { animation: mbBlip .62s ease-out; } }

  /* ----- Cards ----- */
  .card {
    background: var(--page-card); border-radius: var(--radius-2xl);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 0.5px var(--separator);
  }

  .step-num {
    width: 30px; height: 30px; border-radius: 999px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: var(--accent-tint); color: var(--accent);
  }

  .faq-q { font-size: 16px; font-weight: 600; color: var(--label); margin: 0; letter-spacing: -0.01em; }
  .faq-a { font-size: 14.5px; line-height: 1.55; color: var(--label-secondary); margin: 8px 0 0; text-wrap: pretty; }

  hr.rule { border: 0; height: 1px; background: var(--separator); margin: 0; }

  /* ----- Layout grids (named so breakpoints can collapse them) ----- */
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 56px; align-items: center; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; }
  .faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px; max-width: 760px; margin: 0 auto; }

  /* ----- Responsive ----- */
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; max-width: 600px; }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    .split { grid-template-columns: 1fr; gap: 36px; }
    .faq-grid { grid-template-columns: 1fr; gap: 0; max-width: 620px; }
    .nav-hide-sm { display: none; }
    section { padding-top: 60px !important; padding-bottom: 60px !important; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 20px; }
    .scene-anchor { right: 3%; transform: scale(0.84); }
    .hero-cta { width: 100%; }
    .hero-cta .btn { width: 100%; }
    .display { font-size: clamp(34px, 11vw, 44px); }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#2D6CF6"/>
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="34" y="58" width="32" height="20" rx="4"/>
        <path d="M50 50 V32"/>
        <path d="M42 40 L50 30 L58 40"/>
        <circle cx="50" cy="24" r="3.2" fill="#fff" stroke="none"/>
      </g>
    </svg>
  </template>
  <div id="root"></div>
  <script src="../prototypes/onboarding/shared.jsx" type="text/babel"></script>
  <script src="../prototypes/onboarding/tweaks-panel.jsx" type="text/babel"></script>
  <script src="landing.jsx" type="text/babel"></script>
</body>
</html>
