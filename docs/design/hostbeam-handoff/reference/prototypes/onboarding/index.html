<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostbeam — First-run onboarding</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-system); min-height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .d { position: relative; width: 100%; height: 100vh; }
  .mb { position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    color: #fff; background: rgba(20,22,28,0.42); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: inset 0 -0.5px 0 rgba(255,255,255,0.08); }
  .mb-app { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; border-radius: 5px; background: rgba(255,255,255,0.22); }
  .anchor { position: absolute; top: 33px; right: 73px; z-index: 20; }
  .toolbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 10px;
    background: var(--surface-overlay); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-radius: var(--radius-full); box-shadow: var(--shadow-menu); padding: 6px 8px 6px 14px; color: var(--label); }
  .toolbar .lab { font-size: 11.5px; color: var(--label-secondary); white-space: nowrap; }
  .toolbar button { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font-family: var(--font-system); font-size: 12px; font-weight: 600;
    border-radius: var(--radius-full); padding: 6px 12px; background: var(--accent); color: #fff; }
  .toolbar a { font-size: 11.5px; color: var(--label-secondary); text-decoration: none; padding: 6px 8px; border-radius: var(--radius-md); white-space: nowrap; }
  .toolbar a:hover { background: var(--fill-hover); color: var(--label); }
  /* beam-mark motion (window.BeamMark) — the only expressive animation */
  .bm .bm-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .bm .bm-node { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: no-preference) {
    .bm-uploading .bm-el { animation: bmPulse 1.25s ease-in-out infinite; }
    .bm-uploading .bm-ring { animation: bmRing 1.25s ease-out infinite; animation-delay: .36s; }
    .bm-landing .bm-ring { animation: bmRing .72s ease-out 1 forwards; }
    .bm-landing .bm-node { animation: bmPop .6s ease-out 1; }
  }
  @keyframes bmPulse { 0%,100% { opacity: .38; } 14% { opacity: 1; } 42% { opacity: .38; } }
  @keyframes bmRing { 0% { opacity: .5; transform: scale(.55); } 46% { opacity: 0; transform: scale(2); } 100% { opacity: 0; transform: scale(2); } }
  @keyframes bmPop { 0% { transform: scale(1); } 40% { transform: scale(1.24); } 100% { transform: scale(1); } }
  /* menu-bar blip — one-shot beam acknowledgment on beam-landed */
  @keyframes mbBlip {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    32%  { transform: scale(1.18); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
    100% { transform: scale(1);    box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent); }
  }
  @media (prefers-reduced-motion: no-preference) { .mb-app.blip { animation: mbBlip .62s ease-out; } }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="shared.jsx" type="text/babel"></script>
  <script src="flowA.jsx" type="text/babel"></script>
  <script src="tweaks-panel.jsx" type="text/babel"></script>
  <script type="text/babel" data-presets="react">
    (function () {
      const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSlider, TweakColor } = window;

      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
        "arrowStyle": "notch",
        "arrowSize": 8,
        "arrowOffset": 33,
        "accent": "#2D6CF6",
        "dark": false,
        "wallpaper": "#41506b",
        "sshConfig": "has hosts"
      }/*EDITMODE-END*/;

      function accentVars(c) {
        return {
          "--accent": c,
          "--accent-hover": `color-mix(in srgb, ${c} 86%, #000)`,
          "--accent-active": `color-mix(in srgb, ${c} 74%, #000)`,
          "--accent-tint": `color-mix(in srgb, ${c} 13%, transparent)`,
          "--beam-500": c,
          "--focus-ring": `color-mix(in srgb, ${c} 40%, transparent)`,
        };
      }

      function DismissedCard({ beak, onReopen }) {
        const PF = window.PopoverFrameA;
        const DS = window.HostbeamDesignSystem_23dc0f;
        return (
          <PF beak={beak}>
            <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "12px 16px", borderBottom: "1px solid var(--separator)" }}>
              <img src="../../assets/hostbeam-mark.svg" width="18" height="18" alt="" />
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--label)" }}>Hostbeam</span>
            </div>
            <div style={{ padding: "26px 22px 22px", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 11 }}>
              <span style={{ width: 46, height: 46, borderRadius: "50%", background: "var(--fill-secondary)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                <window.Ic name="server" size={22} style={{ color: "var(--label-tertiary)" }} />
              </span>
              <div style={{ fontSize: 14, fontWeight: 600, color: "var(--label)" }}>No host yet</div>
              <div style={{ fontSize: 12, color: "var(--label-secondary)", maxWidth: 224, lineHeight: 1.5 }}>Point me at a host and I’ll beam your screenshots there.</div>
              <div style={{ marginTop: 4 }}>
                <DS.Button variant="primary" size="md" icon={<window.Ic name="plus" size={14} />} onClick={onReopen}>Choose a host</DS.Button>
              </div>
              <div style={{ fontSize: 11, color: "var(--label-tertiary)", maxWidth: 232, lineHeight: 1.45, marginTop: 2 }}>Hostbeam lives in your menu bar — press the hotkey any time.</div>
            </div>
          </PF>
        );
      }

      function App() {
        const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
        const [run, setRun] = React.useState(0);
        const [dismissed, setDismissed] = React.useState(false);
        // Menu-bar "blip": one-shot beam acknowledgment on the always-visible glyph
        // when a beam lands (Ready-state Beam button dispatches hb:beamed).
        const mbRef = React.useRef(null);
        React.useEffect(() => {
          const on = () => { const el = mbRef.current; if (!el) return; el.classList.remove("blip"); void el.offsetWidth; el.classList.add("blip"); setTimeout(() => { if (el) el.classList.remove("blip"); }, 700); };
          window.addEventListener("hb:beamed", on);
          return () => window.removeEventListener("hb:beamed", on);
        }, []);
        const beak = { style: t.arrowStyle, size: t.arrowSize, offset: t.arrowOffset };
        // Sit the popover just low enough that the whole arrow clears the 28px menu
        // bar with its tip touching it (the bar sits above the popover and would
        // otherwise clip the arrow).
        const anchorTop = t.arrowStyle === "none" ? 30
          : t.arrowStyle === "diamond" ? 28 + Math.round(t.arrowSize * 1.2)
          : 27 + t.arrowSize;
        const wp = t.wallpaper;
        const bg = `radial-gradient(120% 90% at 78% 8%, color-mix(in srgb, ${wp} 76%, #fff) 0%, ${wp} 46%, color-mix(in srgb, ${wp} 72%, #000) 100%)`;

        return (
          <div className={"d" + (t.dark ? " theme-dark" : "")} style={{ ...accentVars(t.accent), background: bg }}>
            <div className="mb">
              <span style={{ fontSize: 13, fontWeight: 600, opacity: .9 }}>Terminal</span>
              <span style={{ fontSize: 13, opacity: .7 }}>Shell</span>
              <span style={{ fontSize: 13, opacity: .7 }}>View</span>
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 14 }}>
                <span className="mb-app" ref={mbRef}><img src="../../assets/hostbeam-menubar.svg" width="17" height="17" alt="" /></span>
                <span style={{ fontSize: 12.5, opacity: .85, fontVariantNumeric: "tabular-nums", display: "inline-block", width: 64, textAlign: "right" }}>Sun 15:30</span>
              </div>
            </div>
            <div className="anchor" style={{ top: anchorTop }}>
              {dismissed
                ? <DismissedCard beak={beak} onReopen={() => { setDismissed(false); setRun((r) => r + 1); }} />
                : <window.FlowA key={run} beak={beak} emptyConfig={t.sshConfig === "empty"} onDone={() => setDismissed(true)} />}
            </div>
            <div className="toolbar">
              <span className="lab">First-run onboarding · Popover-native</span>
              <a href="comparison.html">All 3 directions →</a>
              <button onClick={() => { setDismissed(false); setRun((r) => r + 1); }}><img src="../../assets/hostbeam-mark.svg" width="13" height="13" style={{ filter: "brightness(0) invert(1)" }} alt="" /> Replay</button>
            </div>

            <TweaksPanel>
              <TweakSection label="First run" />
              <TweakRadio label="~/.ssh/config" value={t.sshConfig} options={["has hosts", "empty"]} onChange={(v) => { setTweak("sshConfig", v); setRun((r) => r + 1); }} />
              <TweakSection label="Popover arrow" />
              <TweakRadio label="Style" value={t.arrowStyle} options={["notch", "diamond", "none"]} onChange={(v) => setTweak("arrowStyle", v)} />
              <TweakSlider label="Size" value={t.arrowSize} min={4} max={16} step={1} unit="px" onChange={(v) => setTweak("arrowSize", v)} />
              <TweakSlider label="Offset" value={t.arrowOffset} min={12} max={140} step={1} unit="px" onChange={(v) => setTweak("arrowOffset", v)} />
              <TweakSection label="Appearance" />
              <TweakColor label="Accent" value={t.accent} options={["#2D6CF6", "#0E84C2", "#1F8A5B", "#7A5AE0"]} onChange={(v) => setTweak("accent", v)} />
              <TweakRadio label="Theme" value={t.dark ? "dark" : "light"} options={["light", "dark"]} onChange={(v) => setTweak("dark", v === "dark")} />
              <TweakColor label="Wallpaper" value={t.wallpaper} options={["#41506b", "#4a4a52", "#5a4a44", "#36473f"]} onChange={(v) => setTweak("wallpaper", v)} />
            </TweaksPanel>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    })();
  </script>
</body>
</html>
