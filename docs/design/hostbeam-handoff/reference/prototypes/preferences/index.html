<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostbeam — Settings</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-system); min-height: 100vh; overflow: hidden;
    background: #e6e6ea;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .pf-row { transition: background var(--dur-instant) var(--ease-standard); }
  .pf-row:hover { background: var(--fill-hover); }
  .pf-reorder:not(:disabled):hover { color: var(--accent) !important; }
  .pf-nav-item { transition: background var(--dur-instant) var(--ease-standard); }
  .pf-nav-item:not(.is-sel):hover { background: var(--fill-hover); }
  .pf-nav-item:not(.is-sel):active { background: var(--fill-active); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, [role="option"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }
  .pf-pane { animation: pf-fade var(--dur-base) var(--ease-out); }
  @keyframes pf-fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .pf-sheet { animation: pf-sheet-in var(--dur-base) var(--ease-out); }
  @keyframes pf-sheet-in { from { opacity: 0; transform: translateY(-8px) scale(.985); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pf-pane, .pf-sheet { animation: none; } }
  /* tidy macOS-style scrollbar inside the pane */
  .pf-pane::-webkit-scrollbar { width: 9px; }
  .pf-pane::-webkit-scrollbar-thumb { background: var(--fill-tertiary); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  .pf-pane::-webkit-scrollbar-thumb:hover { background: var(--label-quaternary); background-clip: padding-box; }
  .pf-toolbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: var(--radius-full); box-shadow: var(--shadow-menu); padding: 6px 8px 6px 14px; }
  .pf-toolbar .lab { font-size: 11.5px; color: var(--label-secondary); white-space: nowrap; }
  .pf-toolbar a { font-size: 11.5px; color: var(--label-secondary); text-decoration: none; padding: 6px 10px; border-radius: var(--radius-md); white-space: nowrap; }
  .pf-toolbar a:hover { background: var(--fill-hover); color: var(--label); }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="pf-toolbar">
    <span class="lab">Preferences window</span>
    <a href="../popover/index.html">Menu-bar popover →</a>
  </div>
  <script src="../onboarding/shared.jsx" type="text/babel"></script>
  <script src="prefs.jsx" type="text/babel"></script>
  <script type="text/babel" data-presets="react">
    (function () {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.PrefsApp));
    })();
  </script>
</body>
</html>
