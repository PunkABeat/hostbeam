# App Review demo host. See docs/process/ios-submission-checklist.md.
Port 2222
Protocol 2

# Volume-backed, so restarting the container does not change the host identity
# and re-trigger every paired device's host-key mismatch.
HostKey /etc/ssh/keys/ssh_host_ed25519_key

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers review

# Nothing here needs a shell, a tunnel, or a forwarded port.
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
X11Forwarding no
GatewayPorts no
PermitUserRC no

MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 2

# The open door, scoped to the one account that has nothing behind it.
Match User review
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/any-key.sh %t %k
    AuthorizedKeysCommandUser nobody
    ChrootDirectory /srv/review
    # Start in the beam folder, not at the chroot's top. The app takes the
    # folder a session starts in as the login's own (SFTP has no "who am I")
    # and refuses a folder owned by anyone else; the chroot's top must be
    # root's, so starting there refused every beam with "The remote folder
    # belongs to another user" (2026-09-28, the day of submission).
    ForceCommand internal-sftp -d /tmp/hostbeam
    PermitTTY no
