<!-- The menu-bar glyph while auto-beam is armed: the same mark with a filled
     badge, so a state that uploads screenshots on its own is visible without
     opening anything. Template image — black on transparent, macOS recolours it.
     Render: rsvg-convert icons/tray/menubar-armed.svg -w 36 -h 36 \
               -o icons/tray/menubar-armed.png -->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hostbeam menu-bar icon, beaming automatically">
  <circle cx="7.2" cy="2.4" r="1.05" fill="#000000"></circle>
  <path d="M6.1 5 H8.3" stroke="#000000" stroke-width="1.3" stroke-linecap="round"></path>
  <path d="M5.05 7.5 H9.35" stroke="#000000" stroke-width="1.3" stroke-linecap="round"></path>
  <rect x="3.8" y="9.6" width="6.8" height="4.7" rx="1.5" fill="#000000"></rect>
  <circle cx="13.4" cy="4.2" r="2.1" fill="#000000"></circle>
</svg>
