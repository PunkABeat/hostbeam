# cargo-deny: known advisories and where dependencies may come from.
# Run `cargo deny check advisories sources` here; CI does the same.
[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable, and reachable only through Tauri's own build
# tooling; nothing here parses untrusted input. Revisit when Tauri moves off
# them (`cargo deny check advisories` names the ones still present).
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one git dependency, pinned to a commit in Cargo.toml.
allow-git = ["https://github.com/ahkohd/tauri-nspanel"]
